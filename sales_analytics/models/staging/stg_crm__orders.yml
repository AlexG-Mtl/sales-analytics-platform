version: 2

models:
  - name: stg_crm__orders
    description: Cleaned CRM order records. One row per order.

    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: opportunity_id
        tests:
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: sales_rep_id
        tests:
          - not_null

      - name: order_date
        tests:
          - not_null

      - name: order_amount
        tests:
          - not_null

      - name: order_status
        tests:
          - not_null

      - name: ingested_at
        tests:
          - not_null