version: 2

models:
  - name: stg_hr__employees
    description: Cleaned HR employee records. One row per employee.

    columns:
      - name: employee_id
        tests:
          - not_null
          - unique

      - name: employee_email
        tests:
          - not_null

      - name: department_id
        tests:
          - not_null

      - name: job_title
        tests:
          - not_null

      - name: salary
        tests:
          - not_null

      - name: employment_status
        tests:
          - not_null