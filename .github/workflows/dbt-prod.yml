name: dbt Production

on:
  workflow_dispatch:

  schedule:
    - cron: "0 11 * * *"

jobs:
  dbt-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Create Snowflake private key
        run: |
          mkdir -p ~/.snowflake/keys
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.snowflake/keys/ai_dwh_svc_key.p8
          chmod 600 ~/.snowflake/keys/ai_dwh_svc_key.p8

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          sales_analytics:
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                private_key_path: /home/runner/.snowflake/keys/ai_dwh_svc_key.p8
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                database: SALES_ANALYTICS_PROD
                schema: STAGING
                threads: 4
              prod_build:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                private_key_path: /home/runner/.snowflake/keys/ai_dwh_svc_key.p8
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                database: SALES_ANALYTICS_PROD
                schema: BUILD
                threads: 4

            target: prod
          EOF

      - name: Check source freshness
        run: |
          uv run dbt source freshness \
            --project-dir sales_analytics \
            --target prod

      - name: Run dbt build
        run: |
          uv run dbt build \
            --project-dir sales_analytics \
            --target prod_build

      - name: Publish validated mart
        run: |
          uv run dbt run-operation publish_production \
            --project-dir sales_analytics \
            --target prod
