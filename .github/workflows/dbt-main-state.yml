name: dbt Main State

on:
  push:
    branches:
      - main

jobs:
  dbt-main-state:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Create Snowflake private key
        run: |
          mkdir -p ~/.snowflake/keys
          printf '%s\n' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.snowflake/keys/ai_dwh_svc_key.p8
          chmod 600 ~/.snowflake/keys/ai_dwh_svc_key.p8

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          sales_analytics:
            outputs:
              ci:
                type: snowflake
                account: "${{ secrets.SNOWFLAKE_ACCOUNT }}"
                user: "${{ secrets.SNOWFLAKE_USER }}"
                private_key_path: /home/runner/.snowflake/keys/ai_dwh_svc_key.p8
                role: "${{ secrets.SNOWFLAKE_ROLE }}"
                warehouse: "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
                database: SALES_ANALYTICS_CI
                schema: "${{ secrets.SNOWFLAKE_SCHEMA }}"
                threads: 4
            target: ci
          EOF

      - name: dbt build
        run: uv run dbt build --project-dir sales_analytics

      - name: Upload dbt manifest
        uses: actions/upload-artifact@v4
        with:
          name: dbt-main-state
          path: sales_analytics/target/manifest.json
          retention-days: 30