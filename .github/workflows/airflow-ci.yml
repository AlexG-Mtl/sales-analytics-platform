name: Airflow CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "airflow/**"
      - "sales_analytics/**"
      - ".github/workflows/airflow-ci.yml"

jobs:
  validate-airflow-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package dbt project for Airflow
        working-directory: airflow
        run: ./scripts/package_dbt.sh

      - name: Verify packaged dbt project
        run: test -f airflow/include/sales_analytics/dbt_project.yml

      - name: Build Airflow image
        working-directory: airflow
        run: docker build -t sales-analytics-airflow-ci .

      - name: Validate Airflow DAG imports
        run: |
          docker run --rm sales-analytics-airflow-ci python -c \
          "from airflow.dag_processing.dagbag import DagBag; d=DagBag('/usr/local/airflow/dags', include_examples=False); print('Import errors:', d.import_errors); raise SystemExit(1 if d.import_errors else 0)"
